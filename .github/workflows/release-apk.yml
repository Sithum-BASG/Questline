# Signed release APK for demo phones (plan 16.3 / T128).
# Secrets (repo Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   — base64 of the .jks / .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   SUPABASE_URL              — cloud project URL
#   SUPABASE_ANON_KEY         — anon (public) key
# Optional:
#   GOOGLE_WEB_CLIENT_ID
#
# Never commit key.properties or *.jks — both are gitignored.

name: Release APK

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Version name override (blank = pubspec)
        required: false
        default: ""
      build_number:
        description: Version code override (blank = pubspec)
        required: false
        default: ""

jobs:
  apk:
    name: signed release apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode upload keystore
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > questline-release.jks
          ls -la questline-release.jks

      - name: Write key.properties
        working-directory: app/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS secrets are required"
            exit 1
          fi
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../questline-release.jks
          EOF

      - name: Write dart defines for cloud
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY secrets are required"
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          data = {
            "SUPABASE_URL": os.environ["SUPABASE_URL"],
            "SUPABASE_ANON_KEY": os.environ["SUPABASE_ANON_KEY"],
          }
          client = os.environ.get("GOOGLE_WEB_CLIENT_ID") or ""
          if client:
            data["GOOGLE_WEB_CLIENT_ID"] = client
          with open("dart_defines.ci.json", "w", encoding="utf-8") as f:
            json.dump(data, f)
          PY

      - run: flutter pub get

      - name: Build release APK
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          EXTRA=""
          if [ -n "$BUILD_NAME" ]; then EXTRA="$EXTRA --build-name=$BUILD_NAME"; fi
          if [ -n "$BUILD_NUMBER" ]; then EXTRA="$EXTRA --build-number=$BUILD_NUMBER"; fi
          # shellcheck disable=SC2086
          flutter build apk --release \
            --dart-define-from-file=dart_defines.ci.json \
            $EXTRA

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: questline-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
